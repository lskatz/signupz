<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p>{{ site.description }}</p>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>Sign-ups are recorded from comments on each list's GitHub issue.
       {% if site.github.repository_url %}<a href="{{ site.github.repository_url }}/blob/main/COMMANDS.md">All commands</a>.{% endif %}</p>
  </footer>
  <script src="{{ '/assets/signup.js' | relative_url }}" defer></script>
</body>
</html>
